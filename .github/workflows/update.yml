name: 能楽公演データ自動更新

on:
  schedule:
    # 毎日 日本時間 朝6:00（UTC 21:00）に自動実行
    - cron: '0 21 * * *'
  workflow_dispatch: # GitHub画面から手動でいつでも更新可能

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 最新の能楽公演情報を収集
        env:
          TZ: Asia/Tokyo
        run: python scraper.py

      - name: 変更があれば自動コミット＆反映
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/performances.json data/performances.js
          if git diff --staged --quiet; then
            echo "データに変更はありませんでした。"
          else
            git commit -m "自動更新: 最新の能楽公演情報を反映"
            git push
          fi
